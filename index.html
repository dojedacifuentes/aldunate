<!doctype html>
<html lang="es" data-tema="claro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Derecho PUCV · Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Maqueta «Panel»: la estructura del dashboard de Figma (menú lateral, buscador, tarjetas, pestañas de módulos,
   semanas desplegables y panel de materiales) con la identidad de Derecho PUCV, sin cuentas ni fotos. */
:root {
  --fondo: #f3f3f1; --panel: #fff; --texto: #141414; --texto-2: #5f5f5c; --borde: #e2e1dc; --suave: #f6f6f4;
  --rojo: #a81916; --rojo-suave: #f7e8e7; --rojo-texto: #fff;
  --lateral: #a81916; --lateral-texto: #fff; --lateral-2: rgba(255,255,255,.72); --lateral-activo: rgba(255,255,255,.16);
  --verde: #2d7d46; --ambar: #b7790f; --sombra: 0 1px 2px rgba(0,0,0,.05), 0 2px 10px rgba(0,0,0,.04);
  --r: 10px; color-scheme: light;
}
:root[data-tema="oscuro"] {
  --fondo: #000; --panel: #0f0f0f; --texto: #f1f1ef; --texto-2: #a2a29e; --borde: #262624; --suave: #171716;
  --rojo: #e5594e; --rojo-suave: #2a1210; --rojo-texto: #000;
  --lateral: #0a0a0a; --lateral-texto: #f1f1ef; --lateral-2: #9d9d99; --lateral-activo: rgba(229,89,78,.16);
  --verde: #4fae6c; --ambar: #e0a53a; --sombra: none; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--fondo); color: var(--texto); font: 15px/1.5 'IBM Plex Sans', system-ui, sans-serif; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
.mono { font-family: 'IBM Plex Mono', ui-monospace, monospace; }
:focus-visible { outline: 2px solid var(--rojo); outline-offset: 2px; }

/* ---------- Armazón ---------- */
.app { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: 100vh; }
.lateral { position: sticky; top: 0; height: 100vh; background: var(--lateral); color: var(--lateral-texto);
  display: flex; flex-direction: column; padding: 22px 14px 18px; border-right: 1px solid var(--borde); }
.marca { display: flex; align-items: center; gap: 12px; padding: 0 8px 26px; text-decoration: none; color: inherit; }
.marca .esc { width: 40px; height: 52px; perspective: 300px; flex: none; }
.marca .esc svg { width: 100%; height: 100%; transition: transform .25s ease-out; overflow: visible; }
.marca b { display: block; font-size: 15px; line-height: 1.15; }
.marca span { font-size: 12px; color: var(--lateral-2); }
.trazo { stroke-dasharray: 1; stroke-dashoffset: 1; animation: trazar 1.6s cubic-bezier(.6,.1,.2,1) .1s forwards; }
.cruz-l { opacity: 0; animation: brota .5s ease-out forwards; }
.tren { stroke-dasharray: .07 .93; animation: corre 6s linear infinite; }
@keyframes trazar { to { stroke-dashoffset: 0; } }
@keyframes brota { from { opacity: 0; transform: scale(.4); } to { opacity: 1; transform: none; } }
@keyframes corre { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
.menu { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.menu a { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 8px; color: var(--lateral-2);
  text-decoration: none; font-weight: 500; position: relative; transition: background .15s, color .15s; }
.menu a:hover { color: var(--lateral-texto); background: var(--lateral-activo); }
.menu a[aria-current="page"] { color: var(--lateral-texto); background: var(--lateral-activo); }
.menu a[aria-current="page"]::before { content: ''; position: absolute; left: -14px; top: 8px; bottom: 8px; width: 3px; border-radius: 0 3px 3px 0; background: var(--lateral-texto); }
:root[data-tema="oscuro"] .menu a[aria-current="page"]::before { background: var(--rojo); }
.menu svg, .icono { width: 20px; height: 20px; flex: none; }
.lateral .abajo { margin-top: auto; display: grid; gap: 4px; }
.nota-lat { font-size: 11px; line-height: 1.4; color: var(--lateral-2); padding: 12px 12px 0; border-top: 1px solid rgba(255,255,255,.18); margin-top: 8px; }
:root[data-tema="oscuro"] .nota-lat { border-color: var(--borde); }

.cabecera { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 14px; height: 72px; padding: 0 28px;
  background: var(--panel); border-bottom: 1px solid var(--borde); }
.buscador { flex: 1; max-width: 460px; display: flex; align-items: center; gap: 10px; background: var(--suave);
  border: 1px solid var(--borde); border-radius: 8px; padding: 0 12px; height: 42px; color: var(--texto-2); }
.buscador input { border: 0; background: none; outline: none; flex: 1; min-width: 0; color: var(--texto); }
.buscador kbd { font: 500 11px 'IBM Plex Mono', monospace; border: 1px solid var(--borde); border-radius: 4px; padding: 1px 6px; }
.cabecera .der { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.redondo { width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--borde); background: var(--panel);
  display: grid; place-items: center; transition: border-color .15s, transform .15s; }
.redondo:hover { border-color: var(--texto-2); transform: translateY(-1px); }
.perfil { display: flex; align-items: center; gap: 10px; padding: 4px 14px 4px 4px; border-radius: 999px; border: 1px solid var(--borde); background: var(--panel); }
.perfil .ini { width: 34px; height: 34px; border-radius: 50%; background: var(--rojo-suave); color: var(--rojo); display: grid; place-items: center; font-weight: 700; font-size: 13px; }
.perfil b { display: block; font-size: 14px; line-height: 1.1; }
.perfil small { color: var(--texto-2); font-size: 12px; }
.solo-tel { display: none; }

main { min-width: 0; }
.vista { padding: 22px 28px 32px; animation: entra .35s ease-out; }
@keyframes entra { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.titulo { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
.titulo h1 { margin: 0; font-size: 26px; line-height: 1.2; letter-spacing: -.01em; }
.titulo p { margin: 2px 0 0; color: var(--texto-2); }
.titulo .acciones { margin-left: auto; display: flex; gap: 10px; flex-wrap: wrap; }

.btn { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px; border-radius: 8px; border: 1px solid var(--borde);
  background: var(--panel); font-weight: 600; font-size: 14px; text-decoration: none; color: var(--texto); transition: transform .15s, background .15s, border-color .15s; }
.btn:hover { transform: translateY(-1px); border-color: var(--texto-2); }
.btn.lleno { background: var(--rojo); border-color: var(--rojo); color: var(--rojo-texto); }
.btn.suave { background: var(--rojo-suave); border-color: transparent; color: var(--rojo); }
.btn.ancho { width: 100%; justify-content: center; }
.btn .flecha { transition: transform .2s; }
.btn:hover .flecha { transform: translateX(3px); }

.caja { background: var(--panel); border: 1px solid var(--borde); border-radius: var(--r); box-shadow: var(--sombra); min-width: 0; }
.caja h2 { margin: 0; font-size: 16px; }
.muestra { font: 500 11px 'IBM Plex Mono', monospace; color: var(--texto-2); letter-spacing: .02em; }

/* ---------- Inicio ---------- */
.tablero { display: grid; gap: 18px; grid-template-columns: repeat(2, minmax(0, 1fr)) minmax(0, 1.45fr) 330px; }
.dato { padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.dato .n { font-size: 30px; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
.dato .n small { font-size: 16px; color: var(--texto-2); font-weight: 500; }
.dato .l { color: var(--texto-2); font-size: 13px; }
.dato .ic { width: 48px; height: 48px; border-radius: 12px; background: var(--rojo-suave); color: var(--rojo); display: grid; place-items: center; }
.dato .ic svg { width: 24px; height: 24px; }
.sigues { grid-column: 3; grid-row: 1 / 3; padding: 22px 24px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 18px; align-content: start; }
.sigues .eti { font: 600 12px 'IBM Plex Mono', monospace; color: var(--rojo); text-transform: uppercase; letter-spacing: .06em; }
.sigues h2 { font-size: 20px; margin: 2px 0; }
.sigues p { margin: 6px 0 0; color: var(--texto-2); font-size: 14px; grid-column: 1 / -1; }
.sigues .num { grid-column: 2; grid-row: 1 / 3; font: 600 58px/1 'IBM Plex Mono', monospace; color: var(--rojo); letter-spacing: -.04em; align-self: center; }
.pasos-mod { grid-column: 1 / -1; display: flex; gap: 6px; margin: 14px 0 16px; }
.pasos-mod i { flex: 1; height: 6px; border-radius: 3px; background: var(--borde); position: relative; overflow: hidden; }
.pasos-mod i.ok::after, .pasos-mod i.va::after { content: ''; position: absolute; inset: 0; background: var(--rojo); transform-origin: left; animation: llena .8s ease-out both; }
.pasos-mod i.va::after { right: 55%; }
@keyframes llena { from { transform: scaleX(0); } }
.sigues .btn { grid-column: 1 / -1; justify-self: start; }
.avance { grid-column: 1 / 4; padding: 16px 22px 18px; }
.avance header, .semana header { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.selector { margin-left: auto; height: 32px; border-radius: 999px; border: 1px solid var(--rojo); color: var(--rojo); background: none; padding: 0 12px; font-size: 13px; font-weight: 600; }
.barras { list-style: none; margin: 0; padding: 0; display: grid; gap: 7px; }
.barras li { display: grid; grid-template-columns: 26px minmax(0, 1fr) minmax(120px, 1.1fr) 42px; gap: 12px; align-items: center; font-size: 14px; }
.chip-n { width: 24px; height: 24px; border-radius: 6px; display: grid; place-items: center; font: 600 12px 'IBM Plex Mono', monospace; color: #fff; }
.barras .t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pista { height: 10px; border-radius: 5px; background: var(--suave); border: 1px solid var(--borde); overflow: hidden; }
.pista b { display: block; height: 100%; width: 0; background: var(--rojo); border-radius: 5px; transition: width 1s cubic-bezier(.3,.7,.2,1); }
.barras .v { text-align: right; color: var(--texto-2); font: 500 13px 'IBM Plex Mono', monospace; }
.semana { grid-column: 4; grid-row: 1 / 4; padding: 0 0 12px; display: flex; flex-direction: column; }
.pestanas { display: flex; border-bottom: 1px solid var(--borde); position: relative; }
.pestanas button { flex: 1; border: 0; background: none; padding: 16px 8px 14px; font-weight: 600; color: var(--texto-2); }
.pestanas button[aria-selected="true"] { color: var(--texto); }
.pestanas .raya { position: absolute; bottom: -1px; height: 2px; background: var(--rojo); transition: left .25s, width .25s; }
.semana header { padding: 14px 20px 0; margin: 0; font-size: 13px; font-weight: 600; }
.semana header .flechas { margin-left: auto; display: flex; gap: 4px; }
.semana header .flechas button { border: 0; background: none; padding: 4px; border-radius: 6px; color: var(--texto-2); }
.dias { list-style: none; margin: 8px 0 0; padding: 0 20px; display: grid; gap: 4px; }
.dias > li { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 10px; padding: 6px 0; }
.dias .d { font-weight: 600; font-size: 13px; color: var(--texto-2); padding-top: 2px; }
.dias .d b { display: block; font-size: 18px; color: var(--texto); line-height: 1.1; }
.dias ul { list-style: none; margin: 0; padding: 0 0 0 12px; border-left: 3px solid var(--c, var(--borde)); display: grid; gap: 10px; }
.dias ul p { margin: 0; font-size: 14px; line-height: 1.35; font-weight: 500; }
.pild { display: inline-block; margin-top: 4px; font: 500 11px 'IBM Plex Mono', monospace; padding: 2px 8px; border-radius: 999px; background: var(--rojo-suave); color: var(--rojo); }
.pild.gris { background: var(--suave); color: var(--texto-2); border: 1px solid var(--borde); }
.semana .muestra { padding: 10px 20px 0; margin-top: auto; }

/* ---------- Cursos ---------- */
.barra-herr { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
.barra-herr .buscador { margin-left: auto; max-width: 300px; background: var(--panel); }
.desplegable { position: relative; }
.lista-cursos { position: absolute; z-index: 9; top: 46px; left: 0; width: min(420px, 86vw); padding: 6px; list-style: none; margin: 0;
  background: var(--panel); border: 1px solid var(--borde); border-radius: var(--r); box-shadow: 0 12px 30px rgba(0,0,0,.14); }
.lista-cursos[hidden] { display: none; }
.lista-cursos button { width: 100%; display: flex; gap: 10px; align-items: center; text-align: left; border: 0; background: none; padding: 8px 10px; border-radius: 6px; font-size: 14px; }
.lista-cursos button:hover, .lista-cursos button[aria-current="true"] { background: var(--suave); }
.progreso { height: 22px; border-radius: 11px; background: var(--borde); overflow: hidden; margin-bottom: 20px; }
.progreso b { display: flex; align-items: center; height: 100%; padding-left: 10px; background: var(--rojo); color: var(--rojo-texto); font: 600 12px 'IBM Plex Mono', monospace;
  min-width: 46px; border-radius: 11px; transition: width .6s cubic-bezier(.3,.7,.2,1); }
.curso { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 18px; align-items: start; }
.mods { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 14px; }
.mods button { height: 46px; border-radius: 8px; border: 1px solid var(--borde); background: var(--panel); font-weight: 600; color: var(--texto); box-shadow: var(--sombra);
  transition: background .15s, color .15s, transform .15s; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 10px; }
.mods button:hover { transform: translateY(-1px); }
.mods button[aria-selected="true"] { background: var(--rojo); border-color: var(--rojo); color: var(--rojo-texto); }
.mods button .hecho { margin-left: 6px; }
.sesiones { display: grid; gap: 12px; }
.sesion { background: var(--panel); border: 1px solid var(--borde); border-radius: var(--r); overflow: hidden; }
.sesion > button { width: 100%; display: flex; align-items: center; gap: 12px; border: 0; background: none; padding: 14px 18px; text-align: left; font-weight: 600; font-size: 15px; }
.sesion > button .ch { margin-left: auto; transition: transform .25s; color: var(--texto-2); }
.sesion.abierta > button .ch { transform: rotate(180deg); }
.sesion > button .nro { font: 600 12px 'IBM Plex Mono', monospace; color: var(--texto-2); }
.cuerpo { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .3s ease; }
.sesion.abierta .cuerpo { grid-template-rows: 1fr; }
.cuerpo > div { overflow: hidden; }
.cuerpo .in { padding: 4px 18px 18px; border-top: 1px solid var(--borde); }
.cuerpo h3 { font-size: 14px; margin: 14px 0 4px; }
.cuerpo p, .cuerpo li { font-size: 14px; color: var(--texto); margin: 0; }
.cuerpo ul { margin: 4px 0 0; padding-left: 20px; display: grid; gap: 3px; }
.cuerpo .pie-ses { display: flex; gap: 16px; margin-top: 16px; font-size: 13px; }
.cuerpo .pie-ses a { color: var(--rojo); font-weight: 600; text-decoration: none; display: inline-flex; gap: 6px; align-items: center; }
.lado { position: sticky; top: 92px; }
.lado .cont { padding: 18px 20px 20px; }
.lado h3 { font-size: 14px; margin: 0 0 6px; }
.lado ul { margin: 0 0 16px; padding-left: 18px; font-size: 14px; display: grid; gap: 4px; }
.lado ul a { color: var(--texto); text-decoration: underline; text-decoration-color: var(--rojo); text-underline-offset: 3px; }
.lado .btns { display: grid; gap: 10px; margin-top: 4px; }
.checks { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.checks label { display: flex; gap: 12px; align-items: flex-start; padding: 10px 12px; border: 1px solid var(--borde); border-radius: 8px; cursor: pointer; font-size: 14px; transition: border-color .15s, background .15s; }
.checks input { appearance: none; width: 20px; height: 20px; border: 2px solid var(--texto-2); border-radius: 5px; flex: none; margin: 1px 0 0; display: grid; place-items: center; transition: background .15s, border-color .15s; }
.checks input:checked { background: var(--rojo); border-color: var(--rojo); }
.checks input:checked::after { content: ''; width: 5px; height: 10px; border: solid var(--rojo-texto); border-width: 0 2px 2px 0; transform: rotate(45deg) translate(-1px, -1px); }
.checks label:has(input:checked) { background: var(--rojo-suave); border-color: transparent; }
.checks small { display: block; color: var(--texto-2); font-size: 12px; }

/* ---------- Videocápsulas ---------- */
.filtros { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; }
.filtros button { height: 34px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--borde); background: var(--panel); font-size: 13px; font-weight: 600; }
.filtros button[aria-pressed="true"] { background: var(--texto); color: var(--fondo); border-color: var(--texto); }
.rejilla { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 18px; }
.video { overflow: hidden; transition: transform .2s, box-shadow .2s; text-decoration: none; color: inherit; display: block; }
.video:hover { transform: translateY(-3px); box-shadow: 0 10px 24px rgba(0,0,0,.08); }
.mini { aspect-ratio: 16 / 9; background: #121212; color: #fff; position: relative; overflow: hidden; display: grid; place-items: center; }
.mini .gr { position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,.06) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.06) 1px, transparent 1px); background-size: 22px 22px; }
.mini .k { font: 600 46px/1 'IBM Plex Mono', monospace; letter-spacing: -.04em; position: relative; }
.mini .linea { position: absolute; left: 0; right: 0; bottom: 0; height: 5px; }
.mini .dur { position: absolute; right: 10px; bottom: 12px; font: 500 11px 'IBM Plex Mono', monospace; background: rgba(0,0,0,.6); padding: 1px 6px; border-radius: 4px; }
.mini .play { position: absolute; left: 12px; bottom: 12px; width: 30px; height: 30px; border-radius: 50%; background: #fff; color: #111; display: grid; place-items: center; transition: transform .2s; }
.video:hover .play { transform: scale(1.12); }
.mini .visto { position: absolute; top: 10px; left: 10px; font: 600 11px 'IBM Plex Mono', monospace; background: var(--verde); padding: 2px 8px; border-radius: 999px; }
.video .info { padding: 12px 14px 14px; }
.video .info b { display: block; font-size: 14px; line-height: 1.35; }
.video .info span { font-size: 12px; color: var(--texto-2); }

/* ---------- Docentes ---------- */
.seccion-datos { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-bottom: 16px; }
.seccion-datos div { border: 1px solid var(--borde); border-radius: 8px; padding: 10px 12px; }
.seccion-datos b { display: block; font-size: 22px; line-height: 1.1; }
.seccion-datos span { font-size: 12px; color: var(--texto-2); }
.tabla { width: 100%; border-collapse: collapse; font-size: 13px; }
.tabla th { text-align: left; font-weight: 600; color: var(--texto-2); font-size: 12px; padding: 0 0 6px; }
.tabla td { padding: 8px 0; border-top: 1px solid var(--borde); vertical-align: middle; }
.tabla td + td { padding-left: 12px; }
.tabla .pista { height: 8px; width: 100%; }
.estado { font: 600 11px 'IBM Plex Mono', monospace; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.estado.ok { background: rgba(45,125,70,.12); color: var(--verde); }
.estado.lento { background: rgba(183,121,15,.14); color: var(--ambar); }

/* ---------- EVA ---------- */
.chat { display: grid; grid-template-columns: 300px minmax(0, 1fr); height: calc(100vh - 72px - 26px - 40px - 82px); min-height: 520px; overflow: hidden; }
.conv-lista { border-right: 1px solid var(--borde); padding: 16px 12px; overflow: auto; }
.conv-lista h2 { font-size: 13px; color: var(--texto-2); margin: 4px 8px 10px; text-transform: uppercase; letter-spacing: .06em; }
.conv-lista button { width: 100%; text-align: left; border: 0; background: none; padding: 10px; border-radius: 8px; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; align-items: center; font-size: 14px; }
.conv-lista button:hover, .conv-lista button[aria-current="true"] { background: var(--suave); }
.semaf { width: 10px; height: 10px; border-radius: 50%; }
.conv { display: flex; flex-direction: column; min-width: 0; }
.conv header { display: flex; align-items: center; gap: 12px; padding: 14px 20px; border-bottom: 1px solid var(--borde); }
.eva-sello { width: 40px; height: 40px; border-radius: 10px; background: var(--texto); color: var(--fondo); display: grid; place-items: center; font: 600 13px 'IBM Plex Mono', monospace; letter-spacing: .04em; flex: none; }
.conv header b { display: block; }
.conv header small { color: var(--texto-2); font-size: 12px; }
.conv header .vivo { width: 8px; height: 8px; border-radius: 50%; background: var(--verde); display: inline-block; margin-right: 6px; animation: late 2s ease-in-out infinite; }
@keyframes late { 50% { opacity: .3; } }
.mensajes { flex: 1; overflow: auto; padding: 22px; display: flex; flex-direction: column; gap: 14px; background: var(--suave); }
.msj { max-width: 74%; padding: 12px 16px; border-radius: 14px; font-size: 14px; animation: entra .3s ease-out; }
.msj.yo { align-self: flex-end; background: var(--rojo); color: var(--rojo-texto); border-bottom-right-radius: 4px; }
.msj.eva { align-self: flex-start; background: var(--panel); border: 1px solid var(--borde); border-bottom-left-radius: 4px; }
.msj p { margin: 0; }

.escribe i { width: 6px; height: 6px; border-radius: 50%; background: var(--texto-2); animation: late 1s infinite; }
.escribe i:nth-child(2) { animation-delay: .15s; } .escribe i:nth-child(3) { animation-delay: .3s; }
.enviar { display: flex; gap: 10px; padding: 14px 20px; border-top: 1px solid var(--borde); }

  .perfil { padding: 2px; }
  .vista { padding: 18px 16px 96px; }

  .tablero { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }

  .barras li { grid-template-columns: 24px minmax(0, 1fr) 40px; }
  .barras .pista { grid-column: 2 / 4; grid-row: 2; }
  .barras .v { grid-row: 1; grid-column: 3; }
  .curso { grid-template-columns: minmax(0, 1fr); }
  .lado { position: static; }
  .mods { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
  .mods button { height: 40px; font-size: 13px; padding: 0 4px; }
  .mods .largo { display: none; }
  .barra-herr .buscador { display: none; }
  .rejilla { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .mini .k { font-size: 30px; }
  .video .info { padding: 10px; }
  .seccion-datos b { font-size: 18px; }
  .chat { grid-template-columns: minmax(0, 1fr); height: auto; min-height: 0; }
  .conv-lista { border-right: 0; border-bottom: 1px solid var(--borde); display: flex; gap: 6px; overflow-x: auto; padding: 10px; }

  .abajo-tel { display: grid; grid-template-columns: repeat(5, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 8;

  .abajo-tel a { display: grid; justify-items: center; gap: 2px; font-size: 11px; color: var(--texto-2); text-decoration: none; padding: 4px 0; border-radius: 8px; }

}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001s !important; animation-iteration-count: 1 !important; transition-duration: .001s !important; }
}
